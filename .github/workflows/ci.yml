name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-api:
    name: TypeScript (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docs:
    name: Docs (consistency checker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tools/check-docs.test.mjs
      - run: node tools/check-docs.mjs --warn

  docker:
    name: Docker compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The API and web images come from the Dockerfile added with the Compose stack
      # (PR #2). Until that lands, Compose only has the database, so skip instead of failing.
      - name: Check for the app images
        id: stack
        run: |
          if [ -f Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Dockerfile yet; skipping the Docker stack smoke test."
          fi
      - name: Start the stack
        if: steps.stack.outputs.present == 'true'
        run: docker compose up -d --build --wait
      - name: Smoke test
        if: steps.stack.outputs.present == 'true'
        run: bash tools/smoke.sh
      - name: Logs on failure
        if: failure() && steps.stack.outputs.present == 'true'
        run: docker compose logs
      - name: Stop
        if: always() && steps.stack.outputs.present == 'true'
        run: docker compose down -v

  mobile:
    name: Flutter (test, analyze)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with apps/mobile/.fvmrc (golden images depend on the version).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true
      - run: flutter pub get
      # Drift's generated code (*.g.dart) is not committed.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: dart run tool/l10n_check.dart
      - run: dart run tool/sync_fixtures.dart
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - run: flutter test test/goldens
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: apps/mobile/test/goldens/failures/**
          if-no-files-found: ignore
      - run: dart run tool/check_coverage.dart 70 lib/domain lib/data lib/core coverage/lcov.info

  mobile-emulator:
    name: Flutter (integration tests on emulator)
    runs-on: ubuntu-latest
    # Runs on pushes to main, and on pull requests only when apps/mobile changed.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether apps/mobile changed
        id: paths
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- apps/mobile | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No apps/mobile changes; skipping the emulator job."
          fi
      - uses: actions/setup-java@v4
        if: steps.paths.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        if: steps.paths.outputs.run == 'true'
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true
      - name: Enable KVM
        if: steps.paths.outputs.run == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare
        if: steps.paths.outputs.run == 'true'
        working-directory: apps/mobile
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
      - name: Integration tests
        if: steps.paths.outputs.run == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: apps/mobile
          # No integration_test folder exists until the first flow lands.
          script: |
            if [ -d integration_test ]; then flutter test integration_test; else echo "no integration_test yet"; fi

  mobile-size:
    name: Flutter (APK size gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      # Signed with the debug key: size builds only, never distributed.
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - run: dart run tool/check_apk_size.dart build/app/outputs/flutter-apk 35
