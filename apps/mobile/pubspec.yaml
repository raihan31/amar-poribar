name: amar_poribar
description: A private offline-first family finance app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  go_router: ^14.6.0 # Declarative routing, tabs, deep links (T-MOB-08)
  
  # Local Database & Sync
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.8.3
  
  # Communication & APIs
  nearby_connections: ^4.3.0 # Peer to peer sync
  uuid: ^4.3.3
  permission_handler: ^11.3.1 # Runtime permissions for Nearby (Bluetooth, Wi-Fi, location)
  http: ^1.2.2 # REST API client (auth, AI parsing)
  shared_preferences: ^2.3.2 # Small non-secret preferences
  flutter_secure_storage: ^9.2.2 # Access and refresh tokens (FR-AUTH-03)
  speech_to_text: ^7.0.0 # Device Bangla speech recognition (FR-VOICE-01)
  url_launcher: ^6.3.0 # Opens the Play Store page for the Bangla voice (FR-VOICE-07)
  flutter_tts: ^4.2.0 # Reads drafts and the monthly summary aloud (FR-VOICE-03/04)
  firebase_core: ^3.8.0 # Push (T-MOB-34)
  firebase_messaging: ^15.1.5 # FCM tokens and messages
  flutter_local_notifications: ^18.0.1 # Channels, foreground alerts, reminder fallback
  timezone: ^0.10.1 # Asia/Dhaka zoned time for the local daily reminder (T-MOB-35)
  
  # UI & Utils
  fl_chart: ^0.65.0
  intl: ^0.20.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  drift_dev: ^2.14.1
  freezed: ^3.2.3
  json_serializable: ^6.7.1
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  alchemist: ^0.14.1
  json_schema: ^5.2.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
