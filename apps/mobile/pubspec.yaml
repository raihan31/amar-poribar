name: amar_poribar
description: A private offline-first family finance app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  
  # Local Database & Sync
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.8.3
  
  # Communication & APIs
  nearby_connections: ^3.1.2 # Peer to peer sync
  uuid: ^4.3.3
  permission_handler: ^11.3.1 # Runtime permissions for Nearby (Bluetooth, Wi-Fi, location)
  http: ^1.2.2 # REST API client (auth, AI parsing)
  shared_preferences: ^2.3.2 # Keeps the sign-in token
  speech_to_text: ^7.0.0 # Device Bangla speech recognition (FR-VOICE-01)
  flutter_tts: ^4.2.0 # Reads drafts and the monthly summary aloud (FR-VOICE-03/04)
  
  # UI & Utils
  fl_chart: ^0.65.0
  intl: ^0.18.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  drift_dev: ^2.14.1
  freezed: ^3.2.3
  json_serializable: ^6.7.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
