# Run the whole stack with: docker compose up --build
#   web  -> http://localhost:3000
#   api  -> http://localhost:4000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amar
      POSTGRES_PASSWORD: amar
      POSTGRES_DB: amar_poribar
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amar -d amar_poribar"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: applies the Drizzle schema, then exits.
  migrate:
    build: { context: ., target: build }
    working_dir: /repo/apps/api
    command: ["pnpm", "exec", "drizzle-kit", "push", "--force"]
    environment:
      DATABASE_URL: postgres://amar:amar@db:5432/amar_poribar
    depends_on:
      db: { condition: service_healthy }

  api:
    build: { context: ., target: api }
    environment:
      DATABASE_URL: postgres://amar:amar@db:5432/amar_poribar
      PORT: "4000"
      # Development returns the OTP in the response. Production needs an SMS
      # gateway for OTP delivery, which isn't implemented yet, so login won't work there.
      NODE_ENV: ${API_NODE_ENV:-development}
      # No default on purpose: production refuses to start without a strong secret.
      JWT_SECRET: ${JWT_SECRET:-}
      # Browser origins allowed to call the API in production (the web app below).
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      - "4000:4000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: .
      target: web
      args:
        # Baked in at build time; the browser (not the container) calls the API.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db-data:
