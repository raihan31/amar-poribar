# Run the whole stack with: pnpm stack:up   (docker compose up -d --build --wait)
#   web   -> http://localhost:3000   (host port: WEB_PORT)
#   api   -> http://localhost:4000   (host port: API_PORT)
#   db    -> localhost:5432          (host port: DB_PORT)
#   fakes -> http://localhost:4100   (host port: FAKES_PORT)
#   minio (adobe/s3mock) -> :9000 (MINIO_PORT); coturn -> :3478
#   admin -> http://localhost:3100   (profile "admin": docker compose --profile admin up)
# If a port is taken, pick another, e.g.: API_PORT=4001 WEB_PORT=3001 DB_PORT=5434 docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amar
      POSTGRES_PASSWORD: amar
      POSTGRES_DB: amar_poribar
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amar -d amar_poribar"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Test services (profile "test"): `docker compose --profile test up -d --wait db-test minio-test`.
  # Used by `pnpm test:db`; data lives in tmpfs and vanishes with the container.
  db-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amar
      POSTGRES_PASSWORD: amar
      POSTGRES_DB: amar_test
    ports:
      - "${DB_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amar -d amar_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Object store for tests. MinIO stopped publishing community images, so the stack uses
  # adobe/s3mock: an S3-compatible server that ignores credentials and creates buckets on start.
  minio-test:
    profiles: ["test"]
    image: ${S3_IMAGE:-adobe/s3mock:latest}
    environment:
      initialBuckets: amar-test
    ports:
      - "${MINIO_TEST_PORT:-9100}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/ >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Object store for the local stack (service name kept so existing env and docs still match).
  minio:
    image: ${S3_IMAGE:-adobe/s3mock:latest}
    environment:
      initialBuckets: amar
    ports:
      - "${MINIO_PORT:-9000}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/ >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  coturn:
    image: coturn/coturn:latest
    # Shared settings come from the config file; the secret comes from the environment.
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET:-dev-only-turn-secret}
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/$(hostname -i)/3478'"]
      interval: 3s
      timeout: 3s
      retries: 20

  fakes:
    build: { context: ., target: fakes }
    ports:
      - "${FAKES_PORT:-4100}:4100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4100/health >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Migrations run at startup in the api only (MIGRATE_ON_START); the worker waits for the api.
  api:
    build: { context: ., target: api }
    env_file: .env.compose
    environment:
      ROLE: api
      MIGRATE_ON_START: "true"
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_healthy }
      fakes: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/ready >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  worker:
    build: { context: ., target: worker }
    env_file: .env.compose
    environment:
      ROLE: worker
      MIGRATE_ON_START: "false"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4001/health >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      target: web
      args:
        # Baked in at build time; the browser (not the container) calls the API.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-4000}}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Profile "admin" until the admin console exists (T-ADMUI).
  admin:
    profiles: ["admin"]
    build: { context: ., target: admin }
    ports:
      - "${ADMIN_PORT:-3100}:3100"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100 >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
