name: amar_poribar
description: A private offline-first family finance app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  
  # Local Database & Sync
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.8.3
  sqlite_crdt: ^0.1.7 # CRDT implementation for SQLite
  
  # Communication & APIs
  nearby_connections: ^3.1.2 # Peer to peer sync
  uuid: ^4.3.3
  
  # UI & Utils
  fl_chart: ^0.65.0
  intl: ^0.18.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  drift_dev: ^2.14.1
  freezed: ^2.4.1
  json_serializable: ^4.8.1
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
